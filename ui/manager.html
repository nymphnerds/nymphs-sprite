<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nymphs Sprite</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07100f;
      --surface: #0b1514;
      --surface-2: #101b1d;
      --panel: rgba(8, 17, 18, 0.94);
      --panel-2: rgba(5, 12, 12, 0.98);
      --line: #1b3536;
      --line-strong: #284446;
      --text: #f0faf7;
      --muted: #9bb9b4;
      --dim: #789d98;
      --cyan: #29e6da;
      --green: #97df48;
      --warn: #ffc94a;
      --bad: #ff735f;
      --font-head: Bahnschrift, "Arial Narrow", "Segoe UI", sans-serif;
      --font-mono: "Cascadia Mono", "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-body: Inter, "Segoe UI", system-ui, sans-serif;
      font-family: var(--font-body);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    * { scrollbar-width: thin; scrollbar-color: rgba(41, 230, 218, 0.78) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(41, 230, 218, 0.72); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(41, 230, 218, 0.95); }
    ::-webkit-scrollbar-corner { background: transparent; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background:
        linear-gradient(125deg, #020807 0%, #03100e 44%, #061411 78%, #081816 100%);
      font-family: var(--font-body);
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 4px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: rgba(15, 26, 28, 0.85);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 9.8px;
      font-weight: 850;
      line-height: 1.1;
      white-space: nowrap;
      cursor: pointer;
    }

    button::before { content: "//"; color: var(--green); }
    button:hover:not(:disabled) {
      border-color: #315659;
      background: #122022;
      color: var(--green);
    }
    button:disabled {
      color: #5e7a75;
      border-color: #1f3637;
      background: rgba(11, 20, 21, 0.72);
      cursor: default;
      opacity: 0.72;
    }
    button:disabled::before { color: #355a56; }
    button.primary {
      border-color: var(--green);
      background: linear-gradient(90deg, var(--green), rgba(41, 230, 218, 0.92));
      color: #06110f;
      font-weight: 950;
    }
    button.primary::before { color: #06110f; }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      font-size: 12px;
    }

    input,
    select {
      height: 28px;
      padding: 0 7px;
    }

    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 15px) 12px, calc(100% - 10px) 12px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      padding: 8px;
      line-height: 1.34;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--cyan);
      box-shadow: none;
    }

    label {
      display: block;
      margin: 0 0 3px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 9.6px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.035em;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-columns: clamp(260px, 28vw, 300px) minmax(300px, 1fr);
      min-width: 0;
      background: rgba(2, 8, 7, 0.72);
    }

    .sidebar {
      min-width: 0;
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(8, 17, 18, 0.94), rgba(5, 12, 12, 0.98));
      padding: 15px 14px 14px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 11px;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .status-pill {
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-pill.ok { color: var(--green); }
    .status-pill.warn { color: var(--warn); }

    .section {
      border: 0;
      border-top: 1px solid rgba(33, 71, 74, 0.72);
      border-radius: 0;
      background: transparent;
      padding: 11px 0;
      box-shadow: none;
      min-width: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 7px;
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 10.4px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .section-title span:first-child::before { content: "// "; color: var(--cyan); }
    .section-title span:last-child { color: var(--cyan); }

    .field {
      display: grid;
      gap: 0;
      min-width: 0;
      margin-bottom: 7px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .wide { grid-column: 1 / -1; }

    .command-row {
      display: grid;
      gap: 6px;
      margin-top: 7px;
      align-items: stretch;
    }
    .command-row button {
      width: 100%;
      min-width: 0;
      height: 28px;
      min-height: 28px;
      padding: 2px 6px;
      font-size: 9.5px;
      text-align: center;
    }
    .two { grid-template-columns: 1fr 1fr; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .no-top { margin-top: 0; }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    .check {
      min-height: 27px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: rgba(16, 27, 29, 0.82);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
      margin: 0;
    }
    .check input {
      width: 13px;
      height: 13px;
      accent-color: var(--cyan);
      margin: 0;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: rgba(7, 16, 15, 0.88);
    }

    .viewer {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 16px 24px 14px;
      position: relative;
      overflow: hidden;
    }

    .image-shell {
      width: 100%;
      height: 100%;
      max-height: none;
      min-height: 0;
      border: 1px solid rgba(40, 68, 70, 0.9);
      border-radius: 8px;
      background:
        url("__NYMPHS_SPRITE_FOREST_DATA_URI__") center center / cover no-repeat,
        url("nymphs_preview_forest.png") center center / cover no-repeat,
        rgba(4, 12, 11, 0.82);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .image-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: inherit;
      opacity: 0.92;
    }

    .image-shell img {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      object-position: center center;
      display: none;
      position: relative;
      z-index: 2;
    }

    .empty {
      display: grid;
      gap: 8px;
      place-items: center;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .progress {
      padding: 9px 24px 10px;
      display: grid;
      gap: 6px;
      align-content: end;
      background: rgba(11, 23, 24, 0.92);
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      overflow: hidden;
    }
    .status-line span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-line {
      min-width: 0;
      overflow: hidden;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 10.5px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .model-line span:first-child {
      color: var(--cyan);
      font-weight: 900;
      text-transform: uppercase;
    }

    .progress-line {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr) 86px;
      gap: 10px;
      color: var(--muted);
      align-items: center;
    }

    .progress-stage {
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      background: #223532;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--green), var(--warn));
      transition: width 0.22s ease;
    }

    .strip-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
      margin-bottom: 6px;
    }

    .strip-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-weight: 900;
      text-transform: uppercase;
    }
    .strip-title span:last-child {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--cyan);
    }

    .strip-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .strip-controls button {
      min-height: 28px;
      padding: 0 9px;
      font-size: 9.8px;
    }

    .strip-browser {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .folder-select {
      height: 28px;
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .folder-menu {
      position: relative;
      width: 34px;
      height: 28px;
      flex: 0 0 34px;
      display: inline-grid;
      place-items: center;
      align-self: center;
      min-width: 34px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .folder-menu summary {
      width: 34px;
      height: 28px;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: rgba(15, 26, 28, 0.85);
      color: var(--cyan);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      list-style: none;
    }
    .folder-menu summary::-webkit-details-marker { display: none; }
    .folder-menu summary::before { content: ""; }

    .folder-menu-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 6;
      width: 210px;
      display: grid;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: rgba(7, 16, 15, 0.98);
      box-shadow: 0 18px 45px rgba(0,0,0,0.36);
    }

    .folder-menu-panel button {
      width: 100%;
      min-height: 28px;
      justify-content: flex-start;
      padding: 0 9px;
      font-size: 9.8px;
    }

    .strip-select-actions {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }

    .strip-select-actions button {
      min-height: 28px;
      padding: 0 9px;
      font-size: 9.8px;
    }

    .selection-count {
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .gallery {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 124px;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      min-height: 0;
    }
    .gallery:empty { display: none; }

    .thumb {
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 8px;
      background: #08100f;
      padding: 5px;
      display: grid;
      grid-template-rows: 60px auto;
      gap: 5px;
      cursor: pointer;
      min-width: 0;
      position: relative;
    }
    .thumb::before { content: ""; display: none; }
    .thumb.selected { border-color: var(--green); }
    .thumb.checked { border-color: var(--cyan); }
    .thumb img {
      width: 100%;
      height: 60px;
      object-fit: contain;
      object-position: center center;
      border-radius: 5px;
      background: #020403;
    }
    .thumb span {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .thumb.selected span { color: var(--green); }

    .thumb-check {
      position: absolute;
      top: 7px;
      left: 7px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(41, 230, 218, 0.72);
      border-radius: 4px;
      background: rgba(2, 8, 7, 0.86);
      z-index: 3;
      cursor: pointer;
    }

    .thumb-check input {
      width: 14px;
      height: 14px;
      accent-color: var(--green);
      margin: 0;
      cursor: pointer;
    }

    pre {
      max-height: 130px;
      min-width: 0;
      margin: 0;
      overflow: auto;
      padding: 9px 10px;
      border: 1px solid rgba(33, 71, 74, 0.72);
      border-radius: 6px;
      background: rgba(2, 8, 8, 0.72);
      color: #d7e7df;
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    details {
      border: 0;
      border-top: 1px solid rgba(33, 71, 74, 0.72);
      border-radius: 0;
      background: transparent;
      padding: 9px 0 0;
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      color: var(--cyan);
      font-weight: 900;
      font-family: var(--font-mono);
      font-size: 10.4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      list-style: none;
      margin-bottom: 7px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "// "; color: var(--green); }

    @media (max-width: 600px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
      .sidebar { height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .stage { height: 82vh; min-height: min(620px, 100vh); }
      .image-shell { height: 100%; max-height: none; }
      .progress-line { grid-template-columns: 90px minmax(0, 1fr) 46px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Nymphs Sprite</h1>
        <div id="status-pill" class="status-pill warn">checking</div>
      </div>

      <section class="section">
        <div class="section-title"><span>Runtime</span><span id="runtime-chip">Z-Image</span></div>
        <div class="command-row three no-top">
          <button id="open-zimage" type="button">Open</button>
          <button id="refresh-status" type="button">Refresh</button>
          <button id="check-runtime" type="button">Check</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title"><span>Prompt</span><span>8-way</span></div>
        <div class="field">
          <label for="prompt-preset">Prompt</label>
          <select id="prompt-preset"></select>
        </div>
        <div class="field">
          <label for="subject-id">Subject ID</label>
          <input id="subject-id" maxlength="80" value="hero_test" autocomplete="off">
        </div>
        <textarea id="subject-prompt" spellcheck="false" maxlength="1800">solo, 1character, single character only, one figure, a goblin scout assassin, in a deep predatory crouch with a dark tattered hood, glowing pale yellow eyes, lean compact body wrapped in a ragged cloak, holding twin curved rusty daggers, mottled dark green skin barely visible, fully visible full body</textarea>
        <details>
          <summary>Negative</summary>
          <textarea id="negative-prompt" spellcheck="false" maxlength="1800">multiple people, two characters, group, couple, pair, reflection, mirror, turnaround sheet, model sheet, reference sheet, split view, blurry, smooth, photorealistic, 3D render, low quality, deformed, extra limbs, text, watermark, signature, frame, border, cropped, cut off, partial body</textarea>
        </details>
      </section>

      <section class="section">
        <div class="section-title"><span>Z-Image</span><span id="model-chip">r32</span></div>
        <div class="grid">
          <div class="field"><label for="width">Width</label><input id="width" type="number" min="256" max="2048" step="64" value="1024"></div>
          <div class="field"><label for="height">Height</label><input id="height" type="number" min="256" max="2048" step="64" value="1024"></div>
          <div class="field"><label for="steps">Steps</label><input id="steps" type="number" min="1" max="80" value="9"></div>
          <div class="field"><label for="seed">Seed</label><input id="seed" type="number" value="123456789"></div>
          <div class="field wide"><label for="lora-choice">LoRA</label><select id="lora-choice"></select></div>
          <div class="field"><label for="lora-trigger">Trigger</label><input id="lora-trigger" maxlength="80" value="pxlstl"></div>
          <div class="field"><label for="lora-scale">Scale</label><input id="lora-scale" type="number" min="0" max="2" step="0.05" value="0.85"></div>
        </div>
        <div class="command-row">
          <button id="generate-sources" class="primary" type="button">Generate Sources</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title"><span>Sprite</span><span>post</span></div>
        <div class="grid">
          <div class="field"><label for="sprite-size">Sprite Size</label><input id="sprite-size" type="number" min="24" max="512" step="8" value="96"></div>
          <div class="field"><label for="palette-colors">Palette</label><input id="palette-colors" type="number" min="0" max="256" step="1" value="0"></div>
        </div>
        <div class="check-grid" id="directions">
          <label class="check"><input type="checkbox" value="front" checked>Front</label>
          <label class="check"><input type="checkbox" value="front_left" checked>Front left</label>
          <label class="check"><input type="checkbox" value="left" checked>Left</label>
          <label class="check"><input type="checkbox" value="back_left" checked>Back left</label>
          <label class="check"><input type="checkbox" value="back" checked>Back</label>
          <label class="check"><input type="checkbox" value="back_right" checked>Back right</label>
          <label class="check"><input type="checkbox" value="right" checked>Right</label>
          <label class="check"><input type="checkbox" value="front_right" checked>Front right</label>
        </div>
        <div class="command-row">
          <button id="generate-process" type="button">Generate + Process</button>
        </div>
      </section>
    </aside>

    <section class="stage">
      <section class="viewer">
        <div class="image-shell">
          <img id="result-image" alt="Generated sprite preview">
          <div class="empty" id="empty">No output</div>
        </div>
      </section>
      <section class="progress">
        <div class="status-line">
          <span id="runtime-text">No model loaded</span>
          <span id="output-label">No output</span>
        </div>
        <div class="model-line"><span>Selected</span> <span id="selected-model-text">checking</span></div>
        <div class="progress-line">
          <span class="progress-stage" id="progress-stage">Idle</span>
          <span id="progress-detail">Waiting.</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="bar"><span id="progress-bar"></span></div>
        <div class="strip-head">
          <div class="strip-title"><span>Browse</span><span id="strip-label">Current batch (0)</span></div>
          <div class="strip-controls">
            <button id="strip-prev" type="button" title="Previous output">&lt;</button>
            <button id="strip-next" type="button" title="Next output">&gt;</button>
          </div>
        </div>
        <div class="strip-browser">
          <select class="folder-select" id="output-folder" aria-label="Output folder"></select>
          <div class="strip-select-actions">
            <details class="folder-menu" id="folder-menu">
              <summary aria-label="Folder actions" title="Folder actions">...</summary>
              <div class="folder-menu-panel">
                <button id="choose-folder" type="button">Choose Folder</button>
                <button id="open-outputs" type="button">Open Outputs</button>
                <button id="open-logs" type="button">Logs</button>
              </div>
            </details>
            <span class="selection-count" id="selection-count">0 selected</span>
            <button id="select-visible" type="button">Select</button>
            <button id="select-all-visible" type="button">Select All</button>
            <button id="clear-selection" type="button">Clear</button>
          </div>
        </div>
        <input id="folder-picker" type="file" accept="image/*" webkitdirectory multiple hidden>
        <div class="gallery" id="gallery"></div>
        <pre id="output" hidden>Ready.</pre>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const pending = new Map();
    const sharedFoundryNegative = "multiple people, two characters, group, couple, pair, reflection, mirror, turnaround sheet, model sheet, reference sheet, split view, blurry, smooth, photorealistic, 3D render, low quality, deformed, extra limbs, text, watermark, signature, frame, border, busy background, cropped, cut off, partial body";
    const promptPresets = {
      goblin_scout: {
        label: "Foundry: Goblin scout",
        subjectId: "goblin_scout",
        seed: "810500",
        subject: "solo, 1character, single character only, one figure, a goblin scout assassin, in a deep predatory crouch with weight on balls of feet ready to spring, dark tattered hood pulled low over face hiding features except two glowing pale yellow eyes, lean compact body wrapped in a dark grey-brown ragged cloak, holding a curved rusty dagger forward and a second dagger reverse grip behind, mottled dark green skin barely visible under wrappings, fully visible full body",
        negative: `${sharedFoundryNegative}, standing upright, face visible, no hood, no daggers visible, single weapon only, heavy armor, bulky build`
      },
      goblin_warchief: {
        label: "Foundry: Goblin warchief",
        subjectId: "goblin_warchief",
        seed: "810700",
        subject: "solo, 1character, single character only, one figure, a goblin warchief commander, tallest goblin in the warband, commanding upright posture with chest out, dark iron tusked helmet and cheek guards, snarling lower jaw with large fangs, eyes hidden in helmet shadow, crude dark iron pauldrons and riveted chest plate, tattered red war banner strapped to back, notched iron short sword, scarred commanding presence, fully visible full body",
        negative: `${sharedFoundryNegative}, no helmet, bare head, no banner, no armor, hunched posture, submissive, small, mount`
      },
      zombie_shambler: {
        label: "Foundry: Zombie shambler",
        subjectId: "zombie_shambler",
        seed: "800100",
        subject: "solo, 1character, single character only, one figure, a shambling zombie undead creature, hunched broken posture, head tilted to one side, dragging one leg, arms hanging loose and limp, torn dirty grey-green shirt with dark stains, ripped dark pants exposing decayed skin, pale grey-green rotting skin, hollow eye sockets, slack open jaw, matted filthy dark hair, slow lurching stance, fully visible full body",
        negative: `${sharedFoundryNegative}, clean clothes, bright colors, athletic build, upright posture, running, healthy skin, living appearance, weapon, armor`
      },
      beast_root_puppet: {
        label: "Foundry: Root puppet",
        subjectId: "beast_root_puppet",
        seed: "819000",
        subject: "solo, single creature only, one monster, standing humanoid corpse animated by parasitic tree roots, thick roots growing through cracked pale skin on arms and torso, bark-covered lower legs, green leaves sprouting from shoulders, tattered peasant clothing torn by root growth, head tilted to one side with roots emerging from mouth, stiff upright puppet-like pose, ruined medieval peasant garb, fully visible full body",
        negative: sharedFoundryNegative
      },
      beast_clock_golem: {
        label: "Foundry: Clock golem",
        subjectId: "beast_clock_golem",
        seed: "818700",
        subject: "solo, single creature only, one monster, mechanical humanoid construct made of exposed clockwork gears springs and cogs, brass and copper metal body, visible ticking mechanisms inside open chest cavity, steam venting from shoulder and elbow joints, oversized gear wheel embedded in right shoulder, clock face embedded in chest, heavy riveted limbs, amber furnace light glowing from inside, fully visible full body",
        negative: sharedFoundryNegative
      },
      scav_raider: {
        label: "Foundry: Scav raider",
        subjectId: "scav_raider",
        seed: "661122",
        subject: "solo, 1man, single character only, one person, hostile space pirate raider, medium-heavy scrappy build, slightly hunched aggressive forward-leaning stance, dark balaclava mask showing only eyes, torn patched dark grey-brown salvaged EVA vest, irregular metal shoulder plate on left shoulder, improvised blade gauntlet on right forearm, heavy utility belt, dirty worn hostile appearance, fully clothed",
        negative: `${sharedFoundryNegative}, clean armor, polished metal, military uniform, friendly expression, smiling, exposed face, bright colors, cape, medieval, magic`
      },
      drift_lurker: {
        label: "Foundry: Drift lurker",
        subjectId: "drift_lurker",
        seed: "445588",
        subject: "solo, 1creature, single creature only, one alien animal, medium-sized predatory four-legged quadrupedal alien ambush creature called a Drift Lurker, not humanoid, not bipedal, low-slung monitor lizard body plan, horizontal spine parallel to the floor, four thick muscular legs with wide splayed clawed feet, long armored body held close to ground, broad flat wedge predator head, long tapered tail, crouched low ready stance",
        negative: `${sharedFoundryNegative}, humanoid, bipedal, standing upright on two legs, human proportions, anthropomorphic, cute, friendly, wings, robot`
      },
      custom: {
        label: "Custom",
        subject: "",
        negative: ""
      }
    };
    const state = {
      busy: false,
      outputs: [],
      selectedIndex: -1,
      selectedOutputPaths: new Set(),
      localObjectUrls: [],
      manualFolderName: "",
      viewerSource: "outputs",
      selectedLoraPath: "",
      statusValues: {},
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function append(text) {
      if (!text) return;
      const output = $("output");
      output.textContent = output.textContent === "Ready." ? text : `${output.textContent}\n${text}`;
      output.scrollTop = output.scrollHeight;
      parseOutputPaths(text);
      parseProgress(text);
    }

    function setProgress(stage, detail, value) {
      const pct = Math.max(0, Math.min(100, Number(value) || 0));
      $("progress-stage").textContent = stage || "Idle";
      $("progress-detail").textContent = detail || "";
      $("progress-percent").textContent = `${Math.round(pct)}%`;
      $("progress-bar").style.width = `${pct}%`;
    }

    function setBusy(value, label = "Running") {
      state.busy = value;
      document.querySelectorAll("button").forEach((button) => {
        button.disabled = value;
      });
      if (!value) {
        updateStripControls();
      }
      $("status-pill").textContent = value ? label : statusLabel();
      $("status-pill").className = value ? "status-pill warn" : statusClass();
    }

    function parseKeyValues(text) {
      const values = {};
      for (const line of String(text || "").split(/\r?\n/)) {
        const index = line.indexOf("=");
        if (index > 0) values[line.slice(0, index)] = line.slice(index + 1);
      }
      return values;
    }

    function list(value) {
      const text = String(value || "");
      if (!text || text === "none") return [];
      return text.split(",").map((item) => item.trim()).filter(Boolean);
    }

    function loraChoices(value) {
      return list(value).map((item) => {
        const [id, name, ...pathParts] = item.split("|");
        return { id, name: name || id, path: pathParts.join("|") };
      }).filter((item) => item.id && item.path);
    }

    function yes(value) {
      return String(value || "").toLowerCase() === "true";
    }

    function basename(path) {
      const text = String(path || "");
      return text.split(/[\\/]/).filter(Boolean).pop() || text || "none";
    }

    function statusLabel() {
      const values = state.statusValues;
      if (values.health === "ok") return "ready";
      if (values.state) return values.state.replace(/_/g, " ");
      return "checking";
    }

    function statusClass() {
      return state.statusValues.health === "ok" ? "status-pill ok" : "status-pill warn";
    }

    function populateLoraChoices(values) {
      const select = $("lora-choice");
      const choices = loraChoices(values.lora_choices);
      const selectedId = values.selected_lora_candidate || values.weight_profile_selected || "";
      state.selectedLoraPath = values.selected_lora_path || "";
      select.innerHTML = "";
      if (!choices.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No sprite LoRA downloaded";
        select.appendChild(option);
        select.disabled = true;
        return;
      }
      select.disabled = false;
      for (const choice of choices) {
        const option = document.createElement("option");
        option.value = choice.id;
        option.dataset.path = choice.path;
        option.textContent = `${choice.id.replace(/_/g, " ")} / ${choice.name}`;
        select.appendChild(option);
      }
      const selectedOption = Array.from(select.options).find((option) => option.value === selectedId)
        || Array.from(select.options).find((option) => option.dataset.path === values.selected_lora_path)
        || select.options[0];
      if (selectedOption) {
        select.value = selectedOption.value;
        state.selectedLoraPath = selectedOption.dataset.path || state.selectedLoraPath;
      }
    }

    function renderStatus(text) {
      const values = parseKeyValues(text);
      state.statusValues = values;
      const loras = list(values.downloaded_loras);
      const controlReady = yes(values.controlnet_ready);
      const depthReady = yes(values.depth_models_ready);

      $("status-pill").textContent = statusLabel();
      $("status-pill").className = statusClass();
      $("runtime-chip").textContent = values.health === "ok" ? "ready" : "check";
      $("model-chip").textContent = values.weight_profile_selected || "r32";
      $("runtime-text").textContent = values.zimage_url ? `Z-Image ${values.zimage_url}` : "Z-Image";
      $("selected-model-text").textContent = values.selected_lora_path ? basename(values.selected_lora_path) : (loras.join(", ") || "none");
      $("progress-detail").textContent = `LoRA ${loras.length || 0} | Control ${controlReady ? "ready" : "staged"} | Depth ${depthReady ? "ready" : "staged"}`;
      populateLoraChoices(values);
      if (values.selected_lora_trigger) $("lora-trigger").value = values.selected_lora_trigger;
      if (values.selected_lora_scale) $("lora-scale").value = values.selected_lora_scale;
      setProgress("Idle", $("progress-detail").textContent, 0);
    }

    function pathToFileUrl(path) {
      if (!path) return "";
      if (/^(file|https?):\/\//i.test(path)) return path;
      return encodeURI(`file://${path}`);
    }

    function addOutput(path, label) {
      if (!path || path === "None") return;
      if (!/\.(png|jpg|jpeg|webp)$/i.test(path)) return;
      if (state.outputs.some((item) => item.path === path)) return;
      state.outputs.unshift({ path, label: label || basename(path), url: pathToFileUrl(path), managed: true });
      state.viewerSource = "batch";
      renderGallery();
      showOutput(0);
    }

    function parseOutputPaths(text) {
      for (const line of String(text || "").split(/\r?\n/)) {
        const match = line.match(/^(sprite_contact_sheet|output_[A-Za-z0-9_]+)=([^\r\n]+)$/);
        if (match) addOutput(match[2].trim(), match[1].replace(/^output_/, ""));
      }
      const urlMatches = String(text || "").match(/"url"\s*:\s*"([^"]+)"/g) || [];
      for (const item of urlMatches) {
        const match = item.match(/"url"\s*:\s*"([^"]+)"/);
        if (!match) continue;
        const rawUrl = match[1].replace(/\\\//g, "/");
        const base = state.statusValues.zimage_url || "http://127.0.0.1:8090";
        const url = rawUrl.startsWith("/") ? `${base}${rawUrl}` : rawUrl;
        addOutput(url, "zimage");
      }
      const jsonPaths = String(text || "").match(/"output_path"\s*:\s*"([^"]+)"/g) || [];
      for (const item of jsonPaths) {
        const match = item.match(/"output_path"\s*:\s*"([^"]+)"/);
        if (match) addOutput(match[1].replace(/\\\//g, "/"), "output");
      }
    }

    function parseProgress(text) {
      const line = String(text || "").trim();
      if (!line) return;
      if (line.includes("MODEL FETCH STATUS") || line.includes("LORA FETCH STATUS")) {
        setProgress("Fetch", line.replace(/\s+/g, " "), 45);
      } else if (line.startsWith("generate=")) {
        setProgress("Generate", line, 65);
      } else if (line.startsWith("sprite_contact_sheet=")) {
        setProgress("Done", "Contact sheet ready.", 100);
      } else if (line.startsWith("batch_id=")) {
        setProgress("Batch", line, 20);
      }
    }

    function renderGallery() {
      const gallery = $("gallery");
      gallery.innerHTML = "";
      const label = state.manualFolderName || (state.viewerSource === "batch" ? "Current batch" : "Recent");
      $("strip-label").textContent = `${label} (${state.outputs.length})`;
      syncOutputFolder(label);
      updateSelectionCount();
      for (const [index, item] of state.outputs.entries()) {
        const key = outputKey(item);
        const node = document.createElement("div");
        node.className = `thumb ${index === state.selectedIndex ? "selected" : ""} ${state.selectedOutputPaths.has(key) ? "checked" : ""}`;
        node.innerHTML = `
          <label class="thumb-check" title="Select output"><input type="checkbox" ${state.selectedOutputPaths.has(key) ? "checked" : ""}></label>
          <img src="${escapeHtml(item.url)}" alt="">
          <span>${escapeHtml(item.label)}</span>
        `;
        const checkbox = node.querySelector("input");
        checkbox.addEventListener("change", (event) => {
          event.stopPropagation();
          toggleOutputSelection(item, checkbox.checked);
        });
        node.addEventListener("click", () => showOutput(index));
        gallery.appendChild(node);
      }
      updateStripControls();
    }

    function normalizeManagedOutput(item, index) {
      const rawPath = item.path || item.output_path || item.relative_path || item.url || "";
      const url = item.url || pathToFileUrl(rawPath);
      return {
        path: rawPath || url || `output:${index}`,
        relative_path: item.relative_path || rawPath,
        label: item.item_label || item.name || basename(rawPath || url) || `image-${index + 1}`,
        url,
        managed: true,
        created: item.created || item.mtime || 0,
        folder: item.folder || item.batch_id || "",
      };
    }

    async function refreshRecentOutputs(selectFirst = false) {
      if (state.viewerSource === "manual" || state.viewerSource === "batch") return;
      try {
        const text = await moduleAction("list_outputs", { limit: "80" }, { quiet: true, busy: false });
        const body = JSON.parse(String(text || "{}"));
        state.outputs = (body.outputs || []).map(normalizeManagedOutput);
        state.selectedOutputPaths.clear();
        state.manualFolderName = "";
        renderGallery();
        if (selectFirst && state.outputs[0]) showOutput(0);
      } catch {
        syncOutputFolder("Recent");
      }
    }

    function showOutput(index) {
      const item = state.outputs[index];
      if (!item) return;
      state.selectedIndex = index;
      const image = $("result-image");
      image.src = item.url;
      image.style.display = "block";
      $("empty").hidden = true;
      $("output-label").textContent = item.label || basename(item.path);
      renderGallery();
    }

    function outputKey(item) {
      return item?.path || item?.url || "";
    }

    function syncOutputFolder(label) {
      const select = $("output-folder");
      select.innerHTML = "";
      const option = document.createElement("option");
      option.value = "current";
      option.textContent = `${label} (${state.outputs.length})`;
      select.appendChild(option);
      select.value = "current";
      select.disabled = state.outputs.length === 0;
    }

    function updateSelectionCount() {
      const count = state.selectedOutputPaths.size;
      $("selection-count").textContent = `${count} selected`;
    }

    function updateStripControls() {
      $("strip-prev").disabled = state.outputs.length < 2 || state.busy;
      $("strip-next").disabled = state.outputs.length < 2 || state.busy;
      $("select-visible").disabled = state.selectedIndex < 0 || state.busy;
      $("select-all-visible").disabled = state.outputs.length === 0 || state.busy;
      $("clear-selection").disabled = state.selectedOutputPaths.size === 0 || state.busy;
      updateSelectionCount();
    }

    function toggleOutputSelection(item, checked) {
      const key = outputKey(item);
      if (!key) return;
      if (checked) state.selectedOutputPaths.add(key);
      else state.selectedOutputPaths.delete(key);
      renderGallery();
    }

    function selectVisibleOutput() {
      const item = state.outputs[state.selectedIndex];
      if (!item) return;
      state.selectedOutputPaths.add(outputKey(item));
      renderGallery();
    }

    function selectAllVisibleOutputs() {
      for (const item of state.outputs) state.selectedOutputPaths.add(outputKey(item));
      renderGallery();
    }

    function clearOutputSelection() {
      state.selectedOutputPaths.clear();
      renderGallery();
    }

    function clearLocalObjectUrls() {
      for (const url of state.localObjectUrls) URL.revokeObjectURL(url);
      state.localObjectUrls = [];
    }

    function chooseFolderImages(files) {
      const images = Array.from(files || []).filter((file) => file.type.startsWith("image/"));
      clearLocalObjectUrls();
      state.outputs = images.map((file, index) => {
        const url = URL.createObjectURL(file);
        state.localObjectUrls.push(url);
        return {
          path: file.webkitRelativePath || file.name || url,
          label: file.name || `image-${index + 1}`,
          url,
          managed: false,
        };
      });
      state.selectedOutputPaths.clear();
      state.manualFolderName = images[0]?.webkitRelativePath?.split("/")[0] || "Chosen folder";
      state.viewerSource = "manual";
      state.selectedIndex = -1;
      renderGallery();
      if (state.outputs[0]) showOutput(0);
      $("folder-picker").value = "";
    }

    function stepOutput(offset) {
      if (!state.outputs.length) return;
      const current = state.selectedIndex < 0 ? 0 : state.selectedIndex;
      showOutput((current + offset + state.outputs.length) % state.outputs.length);
    }

    function moduleAction(action, args = {}, options = {}) {
      if (!window.chrome || !window.chrome.webview) {
        append("ERROR: NymphsCore Manager bridge is unavailable.");
        $("status-pill").textContent = "bridge";
        $("status-pill").className = "status-pill warn";
        return Promise.reject(new Error("Manager bridge unavailable"));
      }

      const requestId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      if (!options.quiet) append(`$ ${action}`);
      if (options.busy !== false) setBusy(true, action);
      return new Promise((resolve, reject) => {
        pending.set(requestId, { resolve, reject, options });
        window.chrome.webview.postMessage({ type: "module_action", requestId, action, args });
      });
    }

    function onMessage(event) {
      const message = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
      if (!message || !message.type) return;
      if (message.type === "module_action_progress") {
        append(message.line || "");
        return;
      }
      if (message.type !== "module_action_result") return;

      const item = pending.get(message.requestId);
      if (!item) return;
      pending.delete(message.requestId);
      if (item.options.busy !== false) setBusy(false);
      if (message.ok) {
        const text = message.output || "";
        if (!item.options.quiet && text.trim()) append(text.trim());
        item.resolve(text);
      } else {
        const error = message.error || "Action failed.";
        append(`ERROR: ${error}`);
        setProgress("Error", error, 0);
        $("status-pill").textContent = "error";
        $("status-pill").className = "status-pill warn";
        item.reject(new Error(error));
      }
    }

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", onMessage);
    }

    function value(id) {
      return $(id).value.trim();
    }

    function compactArgs(args) {
      return Object.fromEntries(Object.entries(args).filter(([, val]) => String(val).trim() !== ""));
    }

    function populatePromptPresets() {
      const select = $("prompt-preset");
      select.innerHTML = "";
      for (const [id, preset] of Object.entries(promptPresets)) {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = preset.label;
        select.appendChild(option);
      }
      select.value = "goblin_scout";
    }

    function applyPromptPreset(id) {
      const preset = promptPresets[id];
      if (!preset || id === "custom") return;
      if (preset.subjectId) $("subject-id").value = preset.subjectId;
      if (preset.seed) $("seed").value = preset.seed;
      $("subject-prompt").value = preset.subject;
      $("negative-prompt").value = preset.negative;
    }

    function markPromptCustom() {
      if ($("prompt-preset").value !== "custom") $("prompt-preset").value = "custom";
    }

    async function refreshStatus() {
      try {
        const text = await moduleAction("status", {}, { quiet: true, busy: false });
        renderStatus(text);
        await refreshRecentOutputs(true);
      } catch {
        setProgress("Status", "Could not read module status.", 0);
      }
    }

    $("refresh-status").addEventListener("click", refreshStatus);
    $("open-zimage").addEventListener("click", () => moduleAction("start_zimage").catch(() => {}));
    $("check-runtime").addEventListener("click", () => moduleAction("check_runtime").catch(() => {}));
    $("open-outputs").addEventListener("click", () => moduleAction("open_outputs").catch(() => {}));
    $("open-logs").addEventListener("click", () => moduleAction("logs").catch(() => {}));
    $("strip-prev").addEventListener("click", () => stepOutput(-1));
    $("strip-next").addEventListener("click", () => stepOutput(1));
    $("choose-folder").addEventListener("click", () => {
      $("folder-menu").open = false;
      $("folder-picker").click();
    });
    $("folder-picker").addEventListener("change", (event) => chooseFolderImages(event.target.files));
    $("select-visible").addEventListener("click", selectVisibleOutput);
    $("select-all-visible").addEventListener("click", selectAllVisibleOutputs);
    $("clear-selection").addEventListener("click", clearOutputSelection);
    $("lora-choice").addEventListener("change", () => {
      const option = $("lora-choice").selectedOptions[0];
      state.selectedLoraPath = option?.dataset.path || "";
      if (!$("lora-choice").value) return;
      moduleAction("select_lora", { candidate: $("lora-choice").value }, { quiet: false })
        .then(refreshStatus)
        .catch(() => {});
    });
    function runGeneration(action) {
      if (state.busy) return;
      const directions = Array.from(document.querySelectorAll("#directions input:checked")).map((input) => input.value);
      if (!directions.length) {
        append("ERROR: choose at least one direction.");
        return;
      }
      const selectedSources = action === "generate_directions"
        ? Array.from(state.selectedOutputPaths).filter((path) => path && !/^(https?:|manual:)/i.test(path))
        : [];
      state.outputs = [];
      state.selectedIndex = -1;
      state.manualFolderName = "";
      state.viewerSource = "batch";
      state.selectedOutputPaths.clear();
      renderGallery();
      $("result-image").style.display = "none";
      $("empty").hidden = false;
      const sourcesOnly = action === "generate_sources";
      const processingSelected = selectedSources.length > 0;
      setProgress("Generate", sourcesOnly ? "Generating source directions." : (processingSelected ? "Processing selected source images." : "Generating and processing batch."), 10);
      moduleAction(action, compactArgs({
        "subject-id": value("subject-id"),
        "subject-prompt": value("subject-prompt"),
        "negative-prompt": value("negative-prompt"),
        "lora-path": state.selectedLoraPath,
        "lora-trigger": value("lora-trigger"),
        "lora-scale": value("lora-scale"),
        seed: value("seed"),
        steps: value("steps"),
        width: value("width"),
        height: value("height"),
        "sprite-size": value("sprite-size"),
        "palette-colors": value("palette-colors"),
        "source-images": selectedSources.join("|"),
        directions: directions.join(",")
      })).then((text) => {
        parseOutputPaths(text);
        setProgress("Done", state.outputs.length ? (sourcesOnly ? "Source images ready." : "Batch ready.") : "Finished.", 100);
      }).catch(() => {});
    }

    $("prompt-preset").addEventListener("change", () => applyPromptPreset($("prompt-preset").value));
    $("subject-prompt").addEventListener("input", markPromptCustom);
    $("negative-prompt").addEventListener("input", markPromptCustom);
    $("generate-sources").addEventListener("click", () => runGeneration("generate_sources"));
    $("generate-process").addEventListener("click", () => runGeneration("generate_directions"));

    populatePromptPresets();
    applyPromptPreset("goblin_scout");
    renderGallery();
    refreshStatus();
  </script>
</body>
</html>
